# =============================================================
# Pipeline Logstash — Movies Data Platform
# Flux : movies.csv → movies_raw + movies_clean
# =============================================================

input {
  file {
    path => "/data/movies.csv"
    start_position => "beginning"
    sincedb_path => "/tmp/movies_csv.sincedb"
    mode => "read"
    codec => plain { charset => "UTF-8" }
  }
}

# =============================================================
# FILTRES
# =============================================================

filter {

  # -----------------------------------------------------------
  # 1. Parser le CSV
  # -----------------------------------------------------------
  csv {
    separator => ","
    skip_header => true
    quote_char => '"'
    columns => [
      "id", "title", "genres", "original_language", "overview",
      "popularity", "production_companies", "release_date",
      "budget", "revenue", "runtime", "status", "tagline",
      "vote_average", "vote_count", "credits", "keywords",
      "poster_path", "backdrop_path", "recommendations"
    ]
  }

  # -----------------------------------------------------------
  # 2. Ignorer la ligne d'en-tête si elle passe
  # -----------------------------------------------------------
  if [id] == "id" {
    drop {}
  }

  # -----------------------------------------------------------
  # 3. Nettoyage des espaces sur les champs texte
  # -----------------------------------------------------------
  mutate {
    strip => ["title", "original_language", "status", "tagline", "overview"]
  }

  # -----------------------------------------------------------
  # 4. Conversion des types numériques
  # -----------------------------------------------------------
  mutate {
    convert => {
      "id"           => "integer"
      "popularity"   => "float"
      "budget"       => "float"
      "revenue"      => "float"
      "runtime"      => "integer"
      "vote_average" => "float"
      "vote_count"   => "integer"
    }
  }

  # -----------------------------------------------------------
  # 5. Parsing de la date release_date (ISO8601)
  # -----------------------------------------------------------
  date {
    match => ["release_date", "yyyy-MM-dd"]
    target => "release_date"
    tag_on_failure => ["_dateparsefailure"]
  }

  # -----------------------------------------------------------
  # 6. Split des champs multi-valués (séparateur "-")
  # -----------------------------------------------------------
  mutate {
    split => {
      "genres"               => "-"
      "production_companies" => "-"
      "credits"              => "-"
      "keywords"             => "-"
      "recommendations"      => "-"
    }
  }

  # -----------------------------------------------------------
  # 7. Suppression des faux zéros (budget / revenue)
  #    Un budget ou revenu à 0 = donnée manquante masquée
  # -----------------------------------------------------------
  if [budget] and [budget] <= 0 {
    mutate { remove_field => ["budget"] }
  }
  if [revenue] and [revenue] <= 0 {
    mutate { remove_field => ["revenue"] }
  }

  # -----------------------------------------------------------
  # 8. Suppression des champs texte vides
  # -----------------------------------------------------------
  if ![overview] or [overview] == "" {
    mutate { remove_field => ["overview"] }
  }
  if ![tagline] or [tagline] == "" {
    mutate { remove_field => ["tagline"] }
  }

  # -----------------------------------------------------------
  # 9. Champs enrichis via Ruby
  # -----------------------------------------------------------

  # Longueur du titre
  ruby {
    code => '
      t = event.get("title")
      event.set("title_length", t.length) unless t.nil?
    '
  }

  # Extraction de l année depuis release_date
  ruby {
    code => '
      rd = event.get("release_date")
      if rd
        begin
          year = rd.to_s[0..3].to_i
          event.set("release_year", year) if year > 1800
        rescue
        end
      end
    '
  }

  # Décennie de sortie (ex: 2020, 1990...)
  ruby {
    code => '
      y = event.get("release_year")
      event.set("decade", (y / 10) * 10) unless y.nil?
    '
  }

  # -----------------------------------------------------------
  # 10. Bande de popularité (popularity_band)
  # -----------------------------------------------------------
  if [popularity] and [popularity] >= 1000 {
    mutate { add_field => { "popularity_band" => "viral" } }
  } else if [popularity] and [popularity] >= 100 {
    mutate { add_field => { "popularity_band" => "high" } }
  } else if [popularity] and [popularity] >= 10 {
    mutate { add_field => { "popularity_band" => "medium" } }
  } else {
    mutate { add_field => { "popularity_band" => "low" } }
  }

  # -----------------------------------------------------------
  # 11. Bande de note (vote_band)
  # -----------------------------------------------------------
  if [vote_average] and [vote_average] >= 8.0 {
    mutate { add_field => { "vote_band" => "excellent" } }
  } else if [vote_average] and [vote_average] >= 6.0 {
    mutate { add_field => { "vote_band" => "good" } }
  } else if [vote_average] and [vote_average] >= 4.0 {
    mutate { add_field => { "vote_band" => "average" } }
  } else {
    mutate { add_field => { "vote_band" => "poor" } }
  }

  # -----------------------------------------------------------
  # 12. Ère du film (era)
  # -----------------------------------------------------------
  if [release_year] and [release_year] >= 2020 {
    mutate { add_field => { "era" => "2020s" } }
  } else if [release_year] and [release_year] >= 2010 {
    mutate { add_field => { "era" => "2010s" } }
  } else if [release_year] and [release_year] >= 2000 {
    mutate { add_field => { "era" => "2000s" } }
  } else if [release_year] and [release_year] >= 1990 {
    mutate { add_field => { "era" => "1990s" } }
  } else {
    mutate { add_field => { "era" => "classic" } }
  }

  # -----------------------------------------------------------
  # 13. Nettoyage des champs techniques Logstash
  # -----------------------------------------------------------
  mutate {
    remove_field => ["message", "@version", "event", "log", "host"]
  }

}

# =============================================================
# SORTIES
# =============================================================

output {

  # Index brut — données parsées sans enrichissement
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "movies_raw"
    document_id => "%{id}"
  }

  # Index nettoyé — données typées, normalisées et enrichies
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "movies_clean"
    document_id => "%{id}"
  }

  # Debug (décommenter pour tester)
  # stdout { codec => rubydebug }

}
